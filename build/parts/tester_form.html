<form class="form tester-form" novalidate>
        <label>Email<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label>
        <label>Your iPhone<select name="iphone"><option value="">Choose</option><option>iPhone 17 Pro or Pro Max</option><option>iPhone 17 or Air</option><option>iPhone 16 Pro or Pro Max</option><option>iPhone 16 or 16 Plus</option><option>iPhone 15</option><option>iPhone 14 or older</option></select></label>
        <fieldset><legend>What you would use with it</legend>
          <div class="chips">
            <label><input type="checkbox" name="gear" value="gps"><span>GPS receiver</span></label>
            <label><input type="checkbox" name="gear" value="obd"><span>OBD reader</span></label>
            <label><input type="checkbox" name="gear" value="camera"><span>GoPro</span></label>
            <label><input type="checkbox" name="gear" value="heart"><span>Heart-rate strap</span></label>
            <label><input type="checkbox" name="gear" value="iphone"><span>Just my iPhone</span></label>
          </div>
        </fieldset>
        <fieldset class="cars"><legend>Your cars <span class="opt">(up to 5)</span></legend>
          <ol class="car-list" data-cars></ol>
          <button type="button" class="add-car" data-add-car>+ Add a car</button>
        </fieldset>
        <template id="car-row"><li class="car-row">
          <label class="sr-wrap"><span class="sr">Make and model</span><input name="car" maxlength="80" placeholder="Make and model, e.g. Lotus Exige S240"></label>
          <label class="sr-wrap"><span class="sr">How you use it</span><select name="car-use"><option value="track">Track car</option><option value="road">Road car for track days</option><option value="race">Race car</option></select></label>
          <button type="button" class="remove-car" aria-label="Remove this car">×</button>
        </li></template>
        <div class="pair">
          <label><span>Circuits you drive <span class="opt">(optional)</span></span><input name="tracks" maxlength="200" placeholder="e.g. Achna Speedway, Nürburgring"></label>
          <label>How often you go on track<select name="frequency"><option value="">Choose</option><option value="soon">Not yet, soon</option><option value="yearly">Once or twice a year</option><option value="few">A few times a year</option><option value="monthly">About once a month</option><option value="often">More than once a month</option></select></label>
        </div>
        <label><span>Anything else <span class="opt">(optional)</span></span><input name="note" maxlength="500" placeholder="What you'd like Tracky to do for you"></label>
        <label class="consent"><input type="checkbox" name="consent" required><span>Email me about testing Tracky. Details in the <a href="/privacy/#testers">Privacy Policy</a>.</span></label>
        <button class="btn primary" type="submit">Ask to test</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
