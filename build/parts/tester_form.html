<form class="form tester-form" novalidate>
        <label>Email<input name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com"></label>
        <label>Your iPhone<select name="iphone"><option value="">Choose</option><option>iPhone 17 Pro or Pro Max</option><option>iPhone 17 or Air</option><option>iPhone 16 Pro or Pro Max</option><option>iPhone 16 or 16 Plus</option><option>iPhone 15</option><option>iPhone 14 or older</option></select></label>
        <fieldset><legend>What you would use with it</legend>
          <div class="chips">
            <label><input type="checkbox" name="gear" value="gps"><span>GPS receiver</span></label>
            <label><input type="checkbox" name="gear" value="obd"><span>OBD reader</span></label>
            <label><input type="checkbox" name="gear" value="camera"><span>GoPro</span></label>
            <label><input type="checkbox" name="gear" value="heart"><span>Heart-rate strap</span></label>
            <label><input type="checkbox" name="gear" value="iphone"><span>Just my iPhone</span></label>
          </div>
        </fieldset>
        <fieldset class="multi" data-multi="cars" data-max="5" data-one="car"><legend>Your cars <span class="opt">(up to 5)</span></legend>
          <ol class="rows"></ol>
          <button type="button" class="add-row">+ Add a car</button>
        </fieldset>
        <template id="row-cars"><li class="row">
          <label class="grow"><span class="sr">Make and model</span><input name="car" maxlength="80" placeholder="Make and model"></label>
          <span class="seg" role="radiogroup" aria-label="Kind of car"><label><input type="radio" value="race" checked><span>Race car</span></label><label><input type="radio" value="street"><span>Street car</span></label></span>
          <button type="button" class="del" aria-label="Remove">×</button>
        </li></template>
        <fieldset class="multi" data-multi="tracks" data-max="5" data-one="circuit"><legend>Circuits you drive <span class="opt">(up to 5)</span></legend>
          <ol class="rows"></ol>
          <button type="button" class="add-row">+ Add a circuit</button>
        </fieldset>
        <template id="row-tracks"><li class="row">
          <label class="grow"><span class="sr">Circuit</span><input name="track" maxlength="80" placeholder="Circuit" list="circuit-names"></label>
          <button type="button" class="del" aria-label="Remove">×</button>
        </li></template>
        <datalist id="circuit-names"><option value="Achna Speedway"><option value="Spa-Francorchamps"><option value="Silverstone"><option value="Monza"><option value="Suzuka"><option value="Nürburgring"><option value="Red Bull Ring"><option value="Zandvoort"><option value="Barcelona-Catalunya"><option value="Hungaroring"><option value="Brands Hatch"><option value="Hockenheim"><option value="Circuit of the Americas"><option value="Montréal"><option value="Yas Marina"><option value="Albert Park"><option value="Bahrain"></datalist>
        <label class="short">How often you go on track<select name="frequency"><option value="">Choose</option><option value="soon">Not yet, soon</option><option value="yearly">Once or twice a year</option><option value="few">A few times a year</option><option value="monthly">About once a month</option><option value="often">More than once a month</option></select></label>
        <label><span>Anything else <span class="opt">(optional)</span></span><input name="note" maxlength="500" placeholder="What you'd like Tracky to do for you"></label>
        <label class="consent"><input type="checkbox" name="consent" required><span>Email me about testing Tracky. Details in the <a href="/privacy/#testers">Privacy Policy</a>.</span></label>
        <button class="btn primary" type="submit">Ask to test</button>
        <p class="form-status" role="status" aria-live="polite"></p>
      </form>
